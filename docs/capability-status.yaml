schema_version: 2
last_reviewed: "2026-09-01"

scope: 本矩阵记录规则可引用的检测与条件判断能力，并分别记录标准部署可达性、真实实现证据和规则执行证据。威胁路径编号来自 security-model.md。

status_vocabulary:
  verified: 真实算法或固定后端位于标准生产路径，正常、违规、边界、失败、脱敏、规则执行和受保护副作用断言满足当前能力的完成定义。
  baseline: 真实算法或固定后端位于标准生产路径，基础行为已经运行，能力覆盖面或实际效果仍有限。
  experimental: 真实后端已经通过独立评测路径运行；标准生产配置、完整规则执行和失败边界列为后续验证项。
  adapter_only: 接口、Schema、预算或模拟后端合同已经测试；真实外部后端接入列为后续验证项。
  planned: 实现列在后续规划中。

access_vocabulary:
  default: 默认注册表直接提供。
  configurable: Gateway、Core 或命名部署配置可以启用。
  custom_registry: 可信应用代码构造自定义注册表后可以启用。
  unavailable: 当前入口无法启用。
  not_applicable: 该入口不适用于此类能力。

evidence_vocabulary:
  current_audit: 本次审计实际运行了实现。
  quality_gate: 默认测试套件验证实现、预算、失败、脱敏和规则执行合同；本地算法在该套件中直接运行。
  independent_eval: 仓库具有固定真实后端、真实后端测试和评测入口；该证据来自独立评测路径。
  adapter_contract: 测试使用确定性模拟后端验证接口和规则执行合同。
  missing: 对应证据列为后续补充项。

review_basis:
  code_paths:
    - src/agent_guardrail/config/defaults.py
    - src/agent_guardrail/config/deployment.py
    - src/agent_guardrail/gateway/config.py
    - src/agent_guardrail/gateway/app.py
    - src/agent_guardrail/core_service/config.py
    - src/agent_guardrail/core_service/app.py
    - src/agent_guardrail/detector_sdk.py
    - src/agent_guardrail/detectors
    - src/agent_guardrail/predicates
  behavior_tests:
    - tests/unit/test_security_detectors.py
    - tests/unit/test_priority_detectors.py
    - tests/unit/test_secret_detector_parity.py
    - tests/unit/test_pii_detector.py
    - tests/unit/test_prompt_detector_parity.py
    - tests/unit/test_code_detector_parity.py
    - tests/unit/test_real_detector_backends.py
    - tests/unit/test_llm_judge_detector.py
    - tests/unit/test_similarity_detector.py
    - tests/integration/test_builtin_capabilities.py
    - tests/integration/test_invariant_detector_alignment.py
    - tests/integration/test_full_local_detector_profile.py
  backends_exercised_in_quality_gate:
    - presidio_spacy_en
    - semgrep_1_170_0
    - yara_python_4_5_4
  backends_covered_by_independent_eval:
    - protect_ai_deberta_v2
    - meta_promptguard_2_86m
    - external_embedding_service
    - external_llm_judge

capabilities:
  - id: DET-01
    runtime_name: secrets
    profile: local
    kind: detector
    status: verified
    threat_paths: [T01, T02, T05, T09]
    access: {policy: default, detector_runner: default, gateway_core: default}
    evidence: {implementation: quality_gate, policy_enforcement: quality_gate, failure_boundaries: quality_gate}
    scope: 固定格式、上下文校验和误报过滤覆盖 private key、GitHub、AWS、Azure、Slack、OpenAI、Bearer 与赋值型 Secret；结果只包含位置和脱敏指纹。

  - id: DET-02
    runtime_name: pii
    profile: local_validators
    kind: detector
    status: verified
    threat_paths: [T01, T02, T05, T09]
    access: {policy: default, detector_runner: default, gateway_core: default}
    evidence: {implementation: quality_gate, policy_enforcement: quality_gate, failure_boundaries: quality_gate}
    scope: 本地校验规则覆盖电子邮箱、电话、身份证件、金融账号、网络地址和加密货币地址等固定类型；结果不包含原始个人信息。

  - id: DET-03
    runtime_name: pii
    profile: presidio_spacy_en
    kind: detector
    status: verified
    threat_paths: [T01, T02, T05, T09]
    access: {policy: configurable, detector_runner: configurable, gateway_core: configurable}
    evidence: {implementation: current_audit, policy_enforcement: adapter_contract, failure_boundaries: quality_gate}
    scope: 固定 Presidio 2.2.363、spaCy 3.8.15 和英文模型增加 person、location、organization 等英文实体类型；本地校验规则同时保留。

  - id: DET-04
    runtime_name: prompt_injection
    profile: local_patterns
    kind: detector
    status: baseline
    threat_paths: [T03, T04]
    access: {policy: default, detector_runner: default, gateway_core: default}
    evidence: {implementation: quality_gate, policy_enforcement: quality_gate, failure_boundaries: quality_gate}
    scope: 固定中英文高信号模式覆盖指令覆盖、系统提示泄露、角色替换和控制标记。
    limitation: 语义改写、任务目标劫持和未落入固定表达形式的间接注入位于检测范围之外。

  - id: DET-05
    runtime_name: prompt_injection_model
    profile: protect_ai_deberta_v2
    kind: detector
    status: baseline
    threat_paths: [T03, T04]
    access: {policy: configurable, detector_runner: configurable, gateway_core: configurable}
    evidence: {implementation: independent_eval, policy_enforcement: independent_eval, failure_boundaries: quality_gate}
    scope: 标准部署配置固定 Protect AI DeBERTa v2 模型资产、版本、标签映射、512 token 截断和部署阈值。
    limitation: 固定公开攻击与良性语料已经显示低召回和高误报，分类结果只作为规则事实。

  - id: DET-06
    runtime_name: prompt_injection_model
    profile: meta_promptguard_2_86m
    kind: detector
    status: baseline
    threat_paths: [T03, T04]
    access: {policy: configurable, detector_runner: configurable, gateway_core: configurable}
    evidence: {implementation: independent_eval, policy_enforcement: adapter_contract, failure_boundaries: quality_gate}
    scope: 可选部署配置固定 Meta PromptGuard 2 86M 模型资产、版本、评分方式、512 token 截断和 0.9 默认阈值。
    limitation: AgentDojo 风格载荷与语义目标劫持载荷呈现不同检测特性；Llama 4 Community License 适用于模型权重。

  - id: DET-07
    runtime_name: unicode_security
    profile: local
    kind: detector
    status: verified
    threat_paths: [T03, T04, T07]
    access: {policy: default, detector_runner: default, gateway_core: default}
    evidence: {implementation: quality_gate, policy_enforcement: quality_gate, failure_boundaries: quality_gate}
    scope: 本地算法检测双向控制、零宽字符、其他控制与格式字符，以及有限的 Latin、Greek、Cyrillic 混合脚本混淆。

  - id: DET-08
    runtime_name: python_ast_ipython
    profile: local
    kind: detector
    status: verified
    threat_paths: [T04]
    access: {policy: default, detector_runner: default, gateway_core: default}
    evidence: {implementation: quality_gate, policy_enforcement: quality_gate, failure_boundaries: quality_gate}
    scope: 本地解析器识别 Python AST、IPython 结构、语法错误和固定危险类别；输入代码不会被导入或执行。

  - id: DET-09
    runtime_name: hidden_content
    profile: local
    kind: detector
    status: verified
    threat_paths: [T03, T04, T07]
    access: {policy: default, detector_runner: default, gateway_core: default}
    evidence: {implementation: quality_gate, policy_enforcement: quality_gate, failure_boundaries: quality_gate}
    scope: 本地算法检测隐藏 HTML、不可见 CSS、注释以及单轮有界 Base64、百分号和 HTML 实体编码内容。

  - id: DET-10
    runtime_name: semgrep
    profile: pinned_python_rules
    kind: detector
    status: verified
    threat_paths: [T04]
    access: {policy: configurable, detector_runner: configurable, gateway_core: configurable}
    evidence: {implementation: current_audit, policy_enforcement: adapter_contract, failure_boundaries: quality_gate}
    scope: 标准部署配置使用 Semgrep 1.170.0 和包内固定 Python 规则，私有临时文件、输出上限、进程组终止、字符位置转换和脱敏结果均有明确边界。

  - id: DET-11
    runtime_name: yara_injection_signatures
    profile: pinned_injection_rules
    kind: detector
    status: verified
    threat_paths: [T03, T04]
    access: {policy: configurable, detector_runner: configurable, gateway_core: configurable}
    evidence: {implementation: current_audit, policy_enforcement: adapter_contract, failure_boundaries: quality_gate}
    scope: 标准部署配置使用 yara-python 4.5.4、包内固定规则和固定类型映射，覆盖规则编译、原生超时、结果上限、字符位置转换和脱敏结果。

  - id: DET-12
    runtime_name: prompt_injection_judge
    profile: external_llm_judge
    kind: detector
    status: experimental
    threat_paths: [T03, T04]
    access: {policy: custom_registry, detector_runner: custom_registry, gateway_core: custom_registry}
    evidence: {implementation: independent_eval, policy_enforcement: missing, failure_boundaries: adapter_contract}
    scope: 库级接口固定 Judge 后端身份、Prompt 指纹、阈值、输入上限、十秒期限和脱敏判定结果；DeepSeek 后端位于独立评测目录。
    limitation: Judge 通过可信自定义 Registry 接入；真实后端的 Gateway/Core 配置、超时、失败关闭和受保护副作用断言仍属于后续交付。

  - id: SIM-01
    runtime_name: is_similar
    profile: openai_compatible_embedding
    kind: similarity
    status: adapter_only
    threat_paths: [T03, T04]
    access: {policy: custom_registry, detector_runner: unavailable, gateway_core: custom_registry}
    evidence: {implementation: adapter_contract, policy_enforcement: adapter_contract, failure_boundaries: quality_gate}
    scope: 专用相似度条件实现文本提取、成对最大余弦、命名阈值、固定模型身份、输入预算和脱敏结果。
    limitation: 测试使用确定性向量和模拟 OpenAI-compatible Client；真实 embedding 服务、标准部署配置和直接检测入口列为后续接入项。

  - id: PRED-01
    runtime_name: number_in_range
    profile: local
    kind: predicate
    status: verified
    threat_paths: []
    access: {policy: default, detector_runner: not_applicable, gateway_core: default}
    evidence: {implementation: quality_gate, policy_enforcement: quality_gate, failure_boundaries: quality_gate}
    scope: 纯本地条件判断有限 JSON 数值是否位于闭区间。

  - id: PRED-02
    runtime_name: length_in_range
    profile: local
    kind: predicate
    status: verified
    threat_paths: []
    access: {policy: default, detector_runner: not_applicable, gateway_core: default}
    evidence: {implementation: quality_gate, policy_enforcement: quality_gate, failure_boundaries: quality_gate}
    scope: 纯本地条件判断字符串、数组或对象长度是否位于闭区间。

  - id: PRED-03
    runtime_name: url_host_allowed
    profile: local
    kind: predicate
    status: verified
    threat_paths: []
    access: {policy: default, detector_runner: not_applicable, gateway_core: default}
    evidence: {implementation: quality_gate, policy_enforcement: quality_gate, failure_boundaries: quality_gate}
    scope: 纯本地条件判断 HTTP 或 HTTPS 主机是否命中精确或子域允许列表。
    limitation: DNS、私网地址、重绑定、重定向、路径和响应来源属于网络代理与 Sandbox 控制范围。

  - id: PRED-04
    runtime_name: fuzzy_contains
    profile: local_levenshtein
    kind: predicate
    status: verified
    threat_paths: [T03, T04]
    access: {policy: default, detector_runner: not_applicable, gateway_core: default}
    evidence: {implementation: quality_gate, policy_enforcement: quality_gate, failure_boundaries: quality_gate}
    scope: 纯本地有界 Levenshtein 子串条件支持固定编辑距离和工作量上限。
