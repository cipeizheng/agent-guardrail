schema_version: 1
last_verified: "2026-08-14"

status_vocabulary:
  verified: 实际算法或声明的真实后端已运行，并满足完整行为完成定义。
  baseline: 已实现并测试基础能力，但未达到该 roadmap 能力要求的覆盖面。
  adapter_only: 接入、Schema、预算和 Enforcement 已测试，但真实外部后端未验证。
  planned: 尚未实现。

verified_definition:
  - actual_algorithm_or_backend_executed
  - safe_attack_boundary_cases
  - applicable_failure_timeout_budget_cases
  - redacted_evidence
  - registry_matchplan_decision_path
  - enforcement_side_effect_assertion
  - documentation_synchronized
  - quality_gates_passed

priority_capabilities:
  - id: P0-D01
    name: unicode_security
    kind: detector
    status: verified
    threat_paths: [T03, T04, T07]
    implementation: unicode_security
    note: 控制、格式、双向、零宽和有限混合脚本混淆检测已实际运行。

  - id: P0-D02
    name: secrets
    kind: detector
    status: verified
    threat_paths: [T01, T02, T05, T09]
    implementation: secrets
    note: Invariant 的 GitHub/AWS/Azure/Slack 类别及既有 private/OpenAI/Bearer/assigned 规则、校验、误报过滤和脱敏 Enforcement 路径已实际运行。

  - id: P0-D03
    name: pii
    kind: detector
    status: verified
    threat_paths: [T01, T02, T05, T09]
    implementation: pii
    note: 校验型本地规则及 full_local_v1 的 Presidio 2.2.363/spaCy 英文 person/location NER 已真实运行；中文身份证/手机号是额外本地校验能力，通用多语言 NER 不属于完成定义。与固定 Invariant 基线的对比数据见对应评测报告，本矩阵只记录验证状态。

  - id: P0-D04
    name: prompt_injection_model
    kind: detector
    status: baseline
    threat_paths: [T03, T04]
    implementation: prompt_injection_model
    note: full_local_v1 锁定 Protect AI DeBERTa v2 提交，真实 backend、预算、脱敏和 Enforcement 路径均已运行；但固定 0.85 阈值在锁定的 BIPIA 125 条攻击载荷与 NotInject 339 条良性难例上只有 8% recall、39.82% false-positive rate，因此仅为已接入基线，不能作为复杂 prompt injection 的充分防御。

  - id: P0-D06
    name: yara_injection_signatures
    kind: detector
    status: verified
    threat_paths: [T03, T04]
    implementation: yara_injection_signatures
    note: full_local_v1 包内固定 ruleset 已由 yara-python 4.5.4 真实编译和运行，覆盖安全/攻击、UTF-8 span、原生 timeout、结果上限、脱敏和 Enforcement 路径。

  - id: P1-P01
    name: fuzzy_contains
    kind: predicate
    status: verified
    threat_paths: [T03, T04]
    implementation: fuzzy_contains
    note: 纯本地有界 Levenshtein substring、工作量上限和 Enforcement 路径已实际运行；不含语义模型 fallback。

  - id: P1-D04
    name: is_similar
    kind: detector
    status: adapter_only
    threat_paths: [T03, T04]
    implementation: is_similar
    note: Invariant 的 string/list、max-pair、严格阈值和三个命名阈值已实现；EmbeddingProfile 固定 model，Policy 不能选择 model/endpoint/凭据；OpenAI-compatible adapter、预算、timeout、脱敏和 before_model_call 零副作用路径已测试，真实外部 embedding backend 尚未 smoke/eval。

  - id: P1-D01
    name: python_ast_ipython
    kind: detector
    status: verified
    threat_paths: [T04]
    implementation: python_ast_ipython
    note: 本地 AST/IPython 结构、危险类别、语法错误、span、上限和 Enforcement 已实际运行，输入从不执行。

  - id: P1-D02
    name: semgrep
    kind: detector
    status: verified
    threat_paths: [T04]
    implementation: semgrep
    note: 外部隔离 Semgrep 1.170.0 与包内固定 Python ruleset 已真实运行；私有临时目录、关闭 metrics/version check、输出上限、4.8 秒硬终止、取消进程组清理、UTF-8 span 和脱敏路径已验证。

  - id: P1-D03
    name: hidden_content
    kind: detector
    status: verified
    threat_paths: [T03, T04, T07]
    implementation: hidden_content
    note: 隐藏 HTML、不可见 CSS、注释及有界 Base64/百分号/HTML 实体检测和 Enforcement 已实际运行。

other_current_capabilities:
  - name: prompt_injection
    kind: detector
    status: baseline
    threat_paths: [T03, T04]
    implementation: prompt_injection
    note: 确定性高信号模式及 Enforcement 路径已实际运行；它是可解释的局部补充，不覆盖 BIPIA 的间接或语义改写攻击载荷。
  - name: number_in_range
    kind: predicate
    status: verified
    implementation: number_in_range
    note: 有限数值、闭区间和非法边界行为已实际运行。
  - name: length_in_range
    kind: predicate
    status: verified
    implementation: length_in_range
    note: 字符串、数组和对象长度的闭区间行为已实际运行。
  - name: url_host_allowed
    kind: predicate
    status: verified
    implementation: url_host_allowed
    note: HTTP(S) host 规范化、精确/wildcard allowlist 与非法 URL 边界已实际运行；不单独构成完整 SSRF 防护。
