id: i10-whole-pending-monitor
capability: whole-pending analysis with pending subjects
current_support: partial
invariant_reference: [invariant/tests/analyzer/test_monitor.py::TestMonitor::test_analyze_pending]
cases:
  - id: i10-pending-subject-filter
    mode: pending
    oracle: {type: typed_message, role: assistant, contains: blocked}
    runs:
      - id: past-and-pending-matches
        past:
          - id: h1
            kind: message
            phase: post_llm
            payload: {role: assistant, content: {type: text, text: blocked historical}}
        pending:
          - id: n1
            kind: message
            phase: post_llm
            payload: {role: assistant, content: {type: text, text: blocked one}}
          - id: n2
            kind: message
            phase: post_llm
            payload: {role: assistant, content: {type: text, text: blocked two}}
          - id: n3
            kind: message
            phase: post_llm
            payload: {role: assistant, content: {type: text, text: safe}}
        expected:
          matches:
            - subjects: [n1]
              bindings: {message: n1}
            - subjects: [n2]
              bindings: {message: n2}
      - id: past-only-match-not-returned
        past:
          - id: h1
            kind: message
            phase: post_llm
            payload: {role: assistant, content: {type: text, text: blocked historical}}
        pending:
          - id: n1
            kind: message
            phase: post_llm
            payload: {role: assistant, content: {type: text, text: safe}}
        expected: {}
  - id: i10-cross-pending-binding
    mode: pending
    oracle: {type: multi_event, tool_name: send_email, combination_limit: 4}
    runs:
      - id: whole-snapshot-match
        past:
          - id: h1
            kind: message
            phase: pre_llm
            payload: {role: user, content: {type: text, text: first}}
        pending:
          - id: n1
            kind: message
            phase: pre_llm
            payload: {role: user, content: {type: text, text: second}}
          - id: n2
            kind: tool_call
            phase: pre_llm
            payload: {call_id: call-1, name: send_email, arguments: {}}
        expected:
          matches:
            - subjects: [n2]
              bindings: {m1: h1, m2: n1, call: n2}
