id: i11-incremental-dedup
capability: incremental Monitor finding deduplication
current_support: partial
invariant_reference: [invariant/tests/analyzer/test_monitor.py::TestMonitor::test_objects]
cases:
  - id: i11-new-findings-only
    mode: incremental
    oracle: {type: typed_message, role: assistant, contains: blocked}
    runs:
      - id: first-observation
        snapshot:
          - id: h1
            kind: message
            phase: post_llm
            payload: {role: assistant, content: {type: text, text: blocked old}}
        expected:
          matches:
            - subjects: [h1]
              bindings: {message: h1}
      - id: deep-copy-repeat
        snapshot:
          - id: h1
            kind: message
            phase: post_llm
            payload: {role: assistant, content: {type: text, text: blocked old}}
        expected: {}
      - id: append-one-new-event
        snapshot:
          - id: h1
            kind: message
            phase: post_llm
            payload: {role: assistant, content: {type: text, text: blocked old}}
          - id: n1
            kind: message
            phase: post_llm
            payload: {role: assistant, content: {type: text, text: blocked new}}
        expected:
          matches:
            - subjects: [n1]
              bindings: {message: n1}
      - id: append-safe-event
        snapshot:
          - id: h1
            kind: message
            phase: post_llm
            payload: {role: assistant, content: {type: text, text: blocked old}}
          - id: n1
            kind: message
            phase: post_llm
            payload: {role: assistant, content: {type: text, text: blocked new}}
          - id: n2
            kind: message
            phase: post_llm
            payload: {role: assistant, content: {type: text, text: safe}}
        expected: {}
