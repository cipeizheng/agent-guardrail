id: i07-order-semantics
capability: precedes and immediately_precedes without provenance mutation
current_support: partial
invariant_reference: [invariant/tests/analyzer/test_flow.py::TestFlowImmediatePredecessor]
cases:
  - id: i07-precedes
    mode: snapshot
    oracle:
      type: relation_query
      operator: precedes
      source_kind: tool_result
      target_kind: tool_call
      source_tool: get_website
      target_tool: send_email
    runs:
      - id: ordered-hit
        snapshot:
          - id: r1
            kind: tool_result
            phase: post_tool
            payload: {call_id: call-1, name: get_website, output: safe}
          - id: c1
            kind: tool_call
            phase: pre_tool
            payload: {call_id: call-2, name: send_email, arguments: {}}
        expected:
          matches:
            - subjects: [c1]
              bindings: {source: r1, target: c1}
          relations_unchanged: true
      - id: reversed-no-match
        snapshot:
          - id: c1
            kind: tool_call
            phase: pre_tool
            payload: {call_id: call-2, name: send_email, arguments: {}}
          - id: r1
            kind: tool_result
            phase: post_tool
            payload: {call_id: call-1, name: get_website, output: safe}
        expected: {relations_unchanged: true}
  - id: i07-order-does-not-prove-source
    mode: snapshot
    oracle:
      type: relation_query
      operator: derived_from_direct
      source_kind: tool_result
      target_kind: tool_call
      source_tool: get_website
      target_tool: send_email
    runs:
      - id: ordered-without-edge
        snapshot:
          - id: r1
            kind: tool_result
            phase: post_tool
            payload: {call_id: call-1, name: get_website, output: safe}
          - id: c1
            kind: tool_call
            phase: pre_tool
            payload: {call_id: call-2, name: send_email, arguments: {}}
        expected: {relations_unchanged: true}
  - id: i07-immediate-predecessor
    mode: snapshot
    oracle:
      type: relation_query
      operator: immediately_precedes
      source_kind: message
      target_kind: message
    runs:
      - id: adjacent-hit
        snapshot:
          - id: m1
            kind: message
            phase: pre_llm
            payload: {role: user, content: {type: text, text: first}}
          - id: m2
            kind: message
            phase: post_llm
            payload: {role: assistant, content: {type: text, text: second}}
        expected:
          matches:
            - subjects: [m2]
              bindings: {source: m1, target: m2}
      - id: intermediate-event-no-match
        snapshot:
          - id: m1
            kind: message
            phase: pre_llm
            payload: {role: user, content: {type: text, text: first}}
          - id: c1
            kind: tool_call
            phase: pre_tool
            payload: {call_id: call-1, name: noop, arguments: {}}
          - id: m2
            kind: message
            phase: post_llm
            payload: {role: assistant, content: {type: text, text: second}}
        expected: {}
  - id: i07-pair-budget
    mode: snapshot
    oracle:
      type: relation_query
      operator: precedes
      source_kind: message
      target_kind: tool_call
      max_pairs: 1
    runs:
      - id: adjacent-over-limit
        snapshot:
          - id: m1
            kind: message
            phase: pre_llm
            payload: {role: user, content: {type: text, text: first}}
          - id: m2
            kind: message
            phase: pre_llm
            payload: {role: user, content: {type: text, text: second}}
          - id: c1
            kind: tool_call
            phase: pre_tool
            payload: {call_id: call-1, name: noop, arguments: {}}
        expected: {error: resource_exhausted}
