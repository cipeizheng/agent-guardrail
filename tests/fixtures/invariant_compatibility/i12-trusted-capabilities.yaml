id: i12-trusted-capabilities
capability: trusted Predicate and Detector registry boundary
current_support: supported
invariant_reference:
  - invariant/tests/analyzer/test_guarding.py::test_try_import_os
  - invariant/tests/analyzer/test_readme_examples.py::TestReadmeExamples::test_custom_checker
cases:
  - id: i12-registered-predicate
    mode: snapshot
    oracle:
      type: capability
      capability: contains_blocked
      capability_kind: predicate
      registered: true
      contains: blocked
      max_input_bytes: 64
    runs:
      - id: predicate-hit
        snapshot:
          - id: m1
            kind: message
            phase: post_llm
            payload: {role: assistant, content: {type: text, text: blocked answer}}
        expected:
          matches:
            - subjects: [m1]
              bindings: {event: m1}
      - id: predicate-no-match
        snapshot:
          - id: m1
            kind: message
            phase: post_llm
            payload: {role: assistant, content: {type: text, text: safe answer}}
        expected: {}
  - id: i12-unregistered-capability
    mode: compile
    oracle:
      type: capability
      capability: external_checker
      capability_kind: predicate
      registered: false
      contains: blocked
      max_input_bytes: 64
    runs:
      - id: compile-rejected
        expected: {error: compile_error}
  - id: i12-policy-import
    mode: compile
    oracle:
      type: capability
      capability: os_system
      capability_kind: predicate
      registered: true
      requested_import: os
      contains: blocked
      max_input_bytes: 64
    runs:
      - id: import-rejected
        expected: {error: compile_error}
  - id: i12-registered-detector
    mode: snapshot
    oracle:
      type: capability
      capability: prompt_injection
      capability_kind: detector
      registered: true
      contains: injection-marker
      max_input_bytes: 64
    runs:
      - id: detector-hit
        snapshot:
          - id: m1
            kind: message
            phase: post_llm
            payload: {role: assistant, content: {type: text, text: injection-marker}}
        expected:
          matches:
            - subjects: [m1]
              bindings: {event: m1}
              evidence_types: [prompt_injection]
              masked_evidence: ["[MATCH]"]
  - id: i12-detector-timeout
    mode: snapshot
    oracle:
      type: capability
      capability: slow_detector
      capability_kind: detector
      registered: true
      behavior: timeout
      contains: marker
      max_input_bytes: 64
    runs:
      - id: timeout-is-error
        snapshot:
          - id: m1
            kind: message
            phase: post_llm
            payload: {role: assistant, content: {type: text, text: marker}}
        expected: {error: detector_timeout}
  - id: i12-detector-byte-budget
    mode: snapshot
    oracle:
      type: capability
      capability: bounded_detector
      capability_kind: detector
      registered: true
      contains: marker
      max_input_bytes: 6
    runs:
      - id: adjacent-over-limit
        snapshot:
          - id: m1
            kind: message
            phase: post_llm
            payload: {role: assistant, content: {type: text, text: marker-x}}
        expected: {error: resource_exhausted}
