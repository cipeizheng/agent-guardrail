id: i04-derived-values
capability: bounded derived values and collection binding
current_support: partial
invariant_reference: [invariant/tests/analyzer/test_derived_variables.py::TestDerivedVariables::test_subselect]
cases:
  - id: i04-split-lines
    mode: snapshot
    oracle: {type: derived_lines, contains: flagged, max_items: 4, max_bytes: 128}
    runs:
      - id: two-derived-matches
        snapshot:
          - id: m1
            kind: message
            phase: post_llm
            payload:
              role: assistant
              content: {type: text, text: "safe\nflagged one\nflagged two"}
        expected:
          matches:
            - subjects: [m1]
              bindings: {message: m1, line: "m1#payload.content.text:line[1]"}
            - subjects: [m1]
              bindings: {message: m1, line: "m1#payload.content.text:line[2]"}
      - id: no-match
        snapshot:
          - id: m1
            kind: message
            phase: post_llm
            payload: {role: assistant, content: {type: text, text: "safe\nclean"}}
        expected: {}
      - id: item-limit-boundary
        snapshot:
          - id: m1
            kind: message
            phase: post_llm
            payload: {role: assistant, content: {type: text, text: "a\nb\nc\nd"}}
        expected: {}
  - id: i04-derived-item-budget
    mode: snapshot
    oracle: {type: derived_lines, contains: flagged, max_items: 2, max_bytes: 128}
    runs:
      - id: adjacent-item-over-limit
        snapshot:
          - id: m1
            kind: message
            phase: post_llm
            payload: {role: assistant, content: {type: text, text: "a\nb\nflagged"}}
        expected: {error: resource_exhausted}
  - id: i04-derived-byte-budget
    mode: snapshot
    oracle: {type: derived_lines, contains: flagged, max_items: 4, max_bytes: 10}
    runs:
      - id: adjacent-byte-over-limit
        snapshot:
          - id: m1
            kind: message
            phase: post_llm
            payload: {role: assistant, content: {type: text, text: flagged-xxx}}
        expected: {error: resource_exhausted}
