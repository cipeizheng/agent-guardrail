id: i06-bounded-quantifiers
capability: count quantifier with outer binding closure
current_support: partial
invariant_reference: [invariant/tests/analyzer/test_quantifiers.py::TestQuantifiers::test_quantifier_closure]
cases:
  - id: i06-count-related-results
    mode: snapshot
    oracle:
      type: quantified_results
      tool_name: scroll_down
      contains: django
      minimum: 5
      max_candidates: 6
    runs:
      - id: threshold-hit
        snapshot:
          - id: c1
            kind: tool_call
            phase: pre_tool
            payload: {call_id: call-1, name: scroll_down, arguments: {}}
          - id: r1
            kind: tool_result
            phase: post_tool
            payload: {call_id: call-1, name: scroll_down, output: django-1}
            relations: [{source_event_id: c1}]
          - id: r2
            kind: tool_result
            phase: post_tool
            payload: {call_id: call-1, name: scroll_down, output: django-2}
            relations: [{source_event_id: c1}]
          - id: r3
            kind: tool_result
            phase: post_tool
            payload: {call_id: call-1, name: scroll_down, output: django-3}
            relations: [{source_event_id: c1}]
          - id: r4
            kind: tool_result
            phase: post_tool
            payload: {call_id: call-1, name: scroll_down, output: django-4}
            relations: [{source_event_id: c1}]
          - id: r5
            kind: tool_result
            phase: post_tool
            payload: {call_id: call-1, name: scroll_down, output: django-5}
            relations: [{source_event_id: c1}]
        expected:
          matches:
            - subjects: [c1]
              bindings: {call: c1}
      - id: below-threshold
        snapshot:
          - id: c1
            kind: tool_call
            phase: pre_tool
            payload: {call_id: call-1, name: scroll_down, arguments: {}}
          - id: r1
            kind: tool_result
            phase: post_tool
            payload: {call_id: call-1, name: scroll_down, output: django-1}
            relations: [{source_event_id: c1}]
          - id: r2
            kind: tool_result
            phase: post_tool
            payload: {call_id: call-1, name: scroll_down, output: django-2}
            relations: [{source_event_id: c1}]
          - id: r3
            kind: tool_result
            phase: post_tool
            payload: {call_id: call-1, name: scroll_down, output: django-3}
            relations: [{source_event_id: c1}]
          - id: r4
            kind: tool_result
            phase: post_tool
            payload: {call_id: call-1, name: scroll_down, output: django-4}
            relations: [{source_event_id: c1}]
        expected: {}
      - id: unrelated-results-not-counted
        snapshot:
          - id: c1
            kind: tool_call
            phase: pre_tool
            payload: {call_id: call-1, name: scroll_down, arguments: {}}
          - id: c2
            kind: tool_call
            phase: pre_tool
            payload: {call_id: call-2, name: other, arguments: {}}
          - id: r1
            kind: tool_result
            phase: post_tool
            payload: {call_id: call-2, name: other, output: django-1}
            relations: [{source_event_id: c2}]
          - id: r2
            kind: tool_result
            phase: post_tool
            payload: {call_id: call-2, name: other, output: django-2}
            relations: [{source_event_id: c2}]
          - id: r3
            kind: tool_result
            phase: post_tool
            payload: {call_id: call-2, name: other, output: django-3}
            relations: [{source_event_id: c2}]
          - id: r4
            kind: tool_result
            phase: post_tool
            payload: {call_id: call-2, name: other, output: django-4}
            relations: [{source_event_id: c2}]
          - id: r5
            kind: tool_result
            phase: post_tool
            payload: {call_id: call-2, name: other, output: django-5}
            relations: [{source_event_id: c2}]
        expected: {}
  - id: i06-quantifier-budget
    mode: snapshot
    oracle:
      type: quantified_results
      tool_name: scroll_down
      contains: django
      minimum: 5
      max_candidates: 4
    runs:
      - id: adjacent-over-limit
        snapshot:
          - id: c1
            kind: tool_call
            phase: pre_tool
            payload: {call_id: call-1, name: scroll_down, arguments: {}}
          - id: r1
            kind: tool_result
            phase: post_tool
            payload: {call_id: call-1, name: scroll_down, output: django}
            relations: [{source_event_id: c1}]
          - id: r2
            kind: tool_result
            phase: post_tool
            payload: {call_id: call-1, name: scroll_down, output: django}
            relations: [{source_event_id: c1}]
          - id: r3
            kind: tool_result
            phase: post_tool
            payload: {call_id: call-1, name: scroll_down, output: django}
            relations: [{source_event_id: c1}]
          - id: r4
            kind: tool_result
            phase: post_tool
            payload: {call_id: call-1, name: scroll_down, output: django}
            relations: [{source_event_id: c1}]
          - id: r5
            kind: tool_result
            phase: post_tool
            payload: {call_id: call-1, name: scroll_down, output: django}
            relations: [{source_event_id: c1}]
        expected: {error: resource_exhausted}
