id: i01-typed-event-selection
capability: typed Event selection
current_support: partial
invariant_reference: [invariant/tests/analyzer/test_monitor.py::TestMonitor::test_simple]
cases:
  - id: i01-assistant-message-domain
    mode: snapshot
    oracle: {type: typed_message, role: assistant, contains: blocked}
    runs:
      - id: mixed-domain-hit
        snapshot:
          - id: m1
            kind: message
            phase: pre_llm
            payload: {role: user, content: {type: text, text: blocked request}}
          - id: m2
            kind: message
            phase: post_llm
            origin: observed
            payload: {role: assistant, content: {type: text, text: blocked answer}}
          - id: c1
            kind: tool_call
            phase: post_llm
            origin: observed
            payload: {call_id: call-1, name: blocked, arguments: {}}
        expected:
          matches:
            - subjects: [m2]
              bindings: {message: m2}
      - id: safe-assistant
        snapshot:
          - id: m1
            kind: message
            phase: post_llm
            origin: observed
            payload: {role: assistant, content: {type: text, text: safe answer}}
        expected: {}
      - id: empty-content-boundary
        snapshot:
          - id: m1
            kind: message
            phase: post_llm
            origin: observed
            payload: {role: assistant, content: {type: text, text: ""}}
        expected: {}
