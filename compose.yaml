name: agent-guardrail

services:
  core:
    build:
      context: .
      dockerfile: docker/core.Dockerfile
      args:
        # full_deberta default = production image; set DETECTOR_PROFILE=local for
        # a lightweight build that validates the compose architecture only.
        DETECTOR_PROFILE: ${DETECTOR_PROFILE:-full_deberta}
    image: agent-guardrail-core:0.1.0
    environment:
      AGENT_GUARDRAIL_CORE_POLICY_FILE: /config/policy.yaml
      AGENT_GUARDRAIL_CORE_API_KEY: ${AGENT_GUARDRAIL_CORE_API_KEY:?set in .env}
      AGENT_GUARDRAIL_CORE_PROMPT_MODEL_DEVICE: ${AGENT_GUARDRAIL_CORE_PROMPT_MODEL_DEVICE:-cpu}
    volumes:
      - ${AGENT_GUARDRAIL_POLICY_FILE:-./examples/policies/secret-email.yaml}:/config/policy.yaml:ro
    networks:
      - guardrail_internal
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    image: agent-guardrail-gateway:0.1.0
    depends_on:
      core:
        condition: service_healthy
    environment:
      AGENT_GUARDRAIL_DECISION_BACKEND: remote
      AGENT_GUARDRAIL_CORE_URL: http://core:8090
      AGENT_GUARDRAIL_CORE_API_KEY: ${AGENT_GUARDRAIL_CORE_API_KEY:?set in .env}
      AGENT_GUARDRAIL_GATEWAY_API_KEYS: ${AGENT_GUARDRAIL_GATEWAY_API_KEYS:?set in .env}
      AGENT_GUARDRAIL_UPSTREAM_BASE_URL: ${AGENT_GUARDRAIL_UPSTREAM_BASE_URL:-}
      AGENT_GUARDRAIL_UPSTREAM_API_KEY: ${AGENT_GUARDRAIL_UPSTREAM_API_KEY:-}
      AGENT_GUARDRAIL_UPSTREAM_ALLOWED_HOSTS: ${AGENT_GUARDRAIL_UPSTREAM_ALLOWED_HOSTS:-[]}
      AGENT_GUARDRAIL_ANTHROPIC_UPSTREAM_BASE_URL: ${AGENT_GUARDRAIL_ANTHROPIC_UPSTREAM_BASE_URL:-}
      AGENT_GUARDRAIL_ANTHROPIC_UPSTREAM_API_KEY: ${AGENT_GUARDRAIL_ANTHROPIC_UPSTREAM_API_KEY:-}
      AGENT_GUARDRAIL_ANTHROPIC_UPSTREAM_ALLOWED_HOSTS: ${AGENT_GUARDRAIL_ANTHROPIC_UPSTREAM_ALLOWED_HOSTS:-[]}
      AGENT_GUARDRAIL_AUDIT_PATH: /var/lib/agent-guardrail/audit/decisions.jsonl
    ports:
      - "${AGENT_GUARDRAIL_GATEWAY_PORT:-8080}:8080"
    volumes:
      - guardrail_audit:/var/lib/agent-guardrail/audit
    networks:
      - guardrail_internal
      - gateway_egress
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

networks:
  guardrail_internal:
    internal: true
  gateway_egress:

volumes:
  guardrail_audit:
