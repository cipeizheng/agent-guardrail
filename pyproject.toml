[project]
name = "agent-guardrail"
version = "0.1.0"
description = "An explainable policy analyzer and enforcement gateway for AI agents"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ai-agents", "guardrails", "policy", "llm-security", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.10,<3",
    "pyyaml>=6.0,<7",
]

[project.urls]
Homepage = "https://github.com/cipeizheng/agent-guardrail"
Documentation = "https://github.com/cipeizheng/agent-guardrail/tree/main/docs"
Repository = "https://github.com/cipeizheng/agent-guardrail.git"
Issues = "https://github.com/cipeizheng/agent-guardrail/issues"

[project.optional-dependencies]
gateway = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "pydantic-settings>=2.7,<3",
    "uvicorn[standard]>=0.34,<1",
]
core-server = [
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.7,<3",
    "uvicorn[standard]>=0.34,<1",
]
detectors = [
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "presidio-analyzer==2.2.363",
    "sentencepiece==0.2.2",
    "spacy==3.8.15",
    "torch==2.13.0",
    "transformers==4.57.6",
    "yara-python==4.5.4",
]

[project.scripts]
agent-guardrail-prefetch-detectors = "agent_guardrail.config.deployment:prefetch_full_local_assets"

[dependency-groups]
dev = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "mcp>=2,<3",
    "openai>=1.61,<3",
    "pydantic-settings>=2.7,<3",
    "pyright==1.1.411",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
    "uvicorn[standard]>=0.34,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_guardrail"]
# Editable installs additionally expose the repository root (for
# `import evals.lib` in eval entry points) and src/ (for `import
# agent_guardrail`) in both the repo venv and the isolated
# evals/agentdojo environment. Published wheels stay unaffected.
dev-mode-dirs = [".", "src"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.coverage.run]
source = ["agent_guardrail"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.pyright]
exclude = ["evals/agentdojo"]
