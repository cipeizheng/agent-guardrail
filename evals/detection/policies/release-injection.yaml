version: 3

engine:
  max_violations: 100
  on_analysis_error: block
  on_detector_timeout: block

scopes: [pending]

# T03/T07: gate the release of untrusted tool results to the next model call.
# The decision point is the tool_result submission itself; injection facts or
# Unicode control characters in the payload are refused before the model ever
# sees them.
rules:
  - id: block-untrusted-injection-release
    action: block
    events:
      result:
        kind: tool_result
        domain: pending
    where:
      all:
        - compare:
            left: {field: [result, security_facts, trust_class]}
            operator: equals
            right: {literal: external_untrusted}
        - detector:
            id: injection_scan
            capability: prompt_injection
            inputs:
              - value: {field: [result, payload, output]}
                encoding: text
    finding:
      code: untrusted_injection_release
      message: An untrusted tool result contains injection instructions.
      subjects: [result]
      evidence:
        - {source: detector, id: injection_scan}

  - id: block-unicode-smuggling-release
    action: block
    events:
      result:
        kind: tool_result
        domain: pending
    where:
      all:
        - compare:
            left: {field: [result, security_facts, trust_class]}
            operator: equals
            right: {literal: external_untrusted}
        - detector:
            id: unicode_scan
            capability: unicode_security
            inputs:
              - value: {field: [result, payload, output]}
                encoding: text
    finding:
      code: unicode_smuggling_release
      message: An untrusted tool result contains Unicode control characters.
      subjects: [result]
      evidence:
        - {source: detector, id: unicode_scan}
