version: 3

engine:
  max_violations: 100
  on_analysis_error: block
  on_detector_timeout: block

scopes: [pending]

# Deterministic constraints: none of these rules look at untrusted content or
# attacker behavior at all. They bound which tools may run, which URL hosts are
# reachable, and how much money may move.
rules:
  - id: restrict-tool-allowlist
    action: block
    events:
      call:
        kind: tool_call
        domain: pending
    where:
      compare:
        left: {field: [call, payload, name]}
        operator: not_in
        right:
          literal:
            - get_day_calendar
            - read_file
            - read_inbox
            - list_files
            - search
            - send_email
            - fetch_url
            - transfer_funds
    finding:
      code: tool_not_allowlisted
      message: The requested tool is not on the policy allowlist.
      subjects: [call]

  - id: restrict-fetch-host
    action: block
    events:
      call:
        kind: tool_call
        domain: pending
    where:
      all:
        - tool: {binding: call, name: fetch_url}
        - any:
            - not: {present: [call, payload, arguments, url]}
            - not:
                predicate:
                  id: allowed_host
                  capability: url_host_allowed
                  arguments:
                    - {field: [call, payload, arguments, url]}
                    - {literal: [api.example.test, "*.trusted.test"]}
    finding:
      code: url_host_denied
      message: The requested URL host is not allowed by policy.
      subjects: [call]

  - id: restrict-transfer-amount
    action: block
    events:
      call:
        kind: tool_call
        domain: pending
    where:
      all:
        - tool: {binding: call, name: transfer_funds}
        - any:
            - not: {present: [call, payload, arguments, amount]}
            - not:
                predicate:
                  id: amount_allowed
                  capability: number_in_range
                  arguments:
                    - {field: [call, payload, arguments, amount]}
                    - {literal: 0.01}
                    - {literal: 1000.0}
    finding:
      code: transfer_amount_denied
      message: The requested transfer amount is outside policy bounds.
      subjects: [call]
