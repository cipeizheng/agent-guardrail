version: 3

engine:
  max_violations: 100
  on_analysis_error: block
  on_detector_timeout: block

scopes: [pending]

# Ablation baseline for flow_agentdojo (preregistration.md): any untrusted
# tool result that may influence a pending call blocks that call. This is the
# coarsest granularity and is expected to over-block legitimate read-then-act
# work; it exists so the field-level arm has a measured comparison.
rules:
  - id: block-any-untrusted-influence
    action: block
    events:
      source: {kind: tool_result, domain: past}
      sink: {kind: tool_call, domain: pending}
    where:
      all:
        - relation:
            source: source
            target: sink
            operator: may_influence
        - compare:
            left: {field: [source, security_facts, trust_class]}
            operator: equals
            right: {literal: external_untrusted}
    finding:
      code: untrusted_influence_on_pending_call
      message: An untrusted tool result may influence this pending call.
      subjects: [sink]
