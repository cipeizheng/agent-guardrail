version: 3

engine:
  max_violations: 100
  on_analysis_error: block
  on_detector_timeout: block

scopes: [pending]

# T04: gate code execution on semantic danger facts only. Structural types
# (python_import / python_builtin / python_function_call / python_syntax_error)
# are facts about any code and must not block on their own.
rules:
  - id: block-dangerous-code-execution
    action: block
    events:
      call:
        kind: tool_call
        domain: pending
    where:
      all:
        - tool: {binding: call, name: execute_python}
        - detector:
            id: code_scan
            capability: python_ast_ipython
            types_any:
              - python_dangerous_import
              - python_dynamic_execution
              - python_process_execution
              - python_filesystem_access
              - python_network_access
            inputs:
              - value: {field: [call, payload, arguments, code]}
                encoding: text
    finding:
      code: dangerous_code_execution
      message: The code to execute contains a dangerous structure fact.
      subjects: [call]
      evidence:
        - {source: detector, id: code_scan}
