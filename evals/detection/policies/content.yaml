version: 3

engine:
  max_violations: 100
  on_analysis_error: block
  on_detector_timeout: block

scopes: [pending]

# Content facts: block the sink when the detector reports secret material in
# any argument, or PII in the outgoing body. No flow relations are used.
rules:
  - id: block-secret-egress
    action: block
    events:
      call:
        kind: tool_call
        domain: pending
    where:
      all:
        - tool: {binding: call, name: send_email}
        - detector:
            id: secret_scan
            capability: secrets
            inputs:
              - value: {field: [call, payload, arguments]}
                encoding: canonical_json
    finding:
      code: secret_exfiltration
      message: The tool call contains secret material.
      subjects: [call]
      evidence:
        - {source: detector, id: secret_scan}

  - id: block-pii-egress
    action: block
    events:
      call:
        kind: tool_call
        domain: pending
    where:
      all:
        - tool: {binding: call, name: send_email}
        - detector:
            id: pii_scan
            capability: pii
            inputs:
              - value: {field: [call, payload, arguments, body]}
                encoding: text
    finding:
      code: pii_exfiltration
      message: The email body contains personal data.
      subjects: [call]
      evidence:
        - {source: detector, id: pii_scan}
