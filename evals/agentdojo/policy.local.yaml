version: 3

engine:
  max_violations: 100
  on_analysis_error: block
  on_detector_timeout: block

scopes: [pending]

# Source -> sink flow rules: block the dangerous sink tool call (send_email / delete_file)
# when it is influenced by untrusted external tool output, rather than detecting the
# injected content in the tool result itself.
rules:
  - id: block-email-exfiltration-flow
    action: block
    events:
      source: {kind: tool_result, domain: past}
      sink: {kind: tool_call, domain: pending}
    where:
      all:
        - tool: {binding: sink, name: send_email}
        - relation:
            source: source
            target: sink
            operator: may_influence
        - compare:
            left: {field: [source, security_facts, trust_class]}
            operator: equals
            right: {literal: external_untrusted}
    finding:
      code: email_exfiltration_from_untrusted_flow
      message: A send_email call is influenced by untrusted external tool output.
      subjects: [sink]

  - id: block-file-destruction-flow
    action: block
    events:
      source: {kind: tool_result, domain: past}
      sink: {kind: tool_call, domain: pending}
    where:
      all:
        - tool: {binding: sink, name: delete_file}
        - relation:
            source: source
            target: sink
            operator: may_influence
        - compare:
            left: {field: [source, security_facts, trust_class]}
            operator: equals
            right: {literal: external_untrusted}
    finding:
      code: file_destruction_from_untrusted_flow
      message: A delete_file call is influenced by untrusted external tool output.
      subjects: [sink]
