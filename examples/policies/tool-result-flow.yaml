version: 3

scopes: [pending]

rules:
  - id: prevent-private-file-email
    action: block
    events:
      source:
        kind: tool_call
        domain: past
      result:
        kind: tool_result
        domain: past
      destination:
        kind: tool_call
        domain: pending
        phases: [pre_tool]
    where:
      all:
        - compare:
            left: {field: [source, payload, name]}
            operator: in
            right: {literal: [read_private_file]}
        - compare:
            left: {field: [destination, payload, name]}
            operator: in
            right: {literal: [send_email]}
        - relation:
            source: source
            target: result
            operator: derived_from_direct
        - relation:
            source: result
            target: destination
            operator: derived_from_ancestor
    finding:
      code: tool_result_flow_denied
      message: The requested tool flow is not allowed by policy.
      subjects: [destination]
