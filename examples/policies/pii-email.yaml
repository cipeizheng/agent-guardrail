version: 1
engine:
  default_timeout_ms: 200
  detector_timeout_ms: 100
  on_rule_error: block
  on_detector_timeout: block
  max_violations: 100
rules:
  - id: prevent-selected-pii-email
    type: pii_exfiltration
    enabled: true
    action: block
    phases: [post_llm, pre_tool]
    config:
      tools: [send_email]
      text_arguments: [subject, body]
      entities:
        - email_address
        - phone_number
        - us_ssn
        - credit_card
        - cn_resident_id
        - cn_mobile_phone
