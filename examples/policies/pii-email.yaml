version: 3

engine:
  max_violations: 100
  on_analysis_error: block
  on_detector_timeout: block

scopes: [pending]

rules:
  - id: prevent-pii-email
    action: block
    events:
      call:
        kind: tool_call
        domain: pending
        phases: [post_llm, pre_tool]
    where:
      all:
        - tool: {binding: call, name: send_email}
        - detector:
            id: pii_scan
            capability: pii
            inputs:
              - value: {field: [call, payload, arguments]}
                encoding: canonical_json
            types_any:
              - email_address
              - phone_number
              - us_ssn
              - credit_card
              - cn_resident_id
              - cn_mobile_phone
    finding:
      code: pii_exfiltration
      message: The tool call contains personally identifiable information.
      subjects: [call]
      evidence:
        - {source: detector, id: pii_scan}
