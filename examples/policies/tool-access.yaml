version: 3

scopes: [pending]

rules:
  - id: restrict-tools
    action: block
    events:
      call:
        kind: tool_call
        domain: pending
        phases: [post_llm, pre_tool]
    where:
      compare:
        left: {field: [call, payload, name]}
        operator: in
        right: {literal: [send_email]}
    finding:
      code: tool_access_denied
      message: The requested tool is not allowed by policy.
      subjects: [call]
