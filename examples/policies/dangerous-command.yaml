version: 3

engine:
  max_violations: 100
  on_analysis_error: block
  on_detector_timeout: block

scopes: [pending]

rules:
  - id: reject-dangerous-command
    action: block
    events:
      call:
        kind: tool_call
        domain: pending
        phases: [post_llm, pre_tool]
    where:
      all:
        - compare:
            left: {field: [call, payload, name]}
            operator: in
            right: {literal: [shell, terminal]}
        - detector:
            id: command_scan
            capability: dangerous_command
            inputs:
              - value: {field: [call, payload, arguments]}
                encoding: canonical_json
    finding:
      code: dangerous_command_detected
      message: The shell tool call contains a dangerous command pattern.
      subjects: [call]
      evidence:
        - {source: detector, id: command_scan}
