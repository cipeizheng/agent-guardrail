version: 1

engine:
  default_timeout_ms: 1000
  detector_timeout_ms: 500
  on_rule_error: block
  on_detector_timeout: block
  max_violations: 100

rules:
  - id: prevent-secret-email
    type: secret_exfiltration
    enabled: true
    action: block
    phases: [post_llm, pre_tool]
    config:
      tools: [send_email]
      text_arguments: [subject, body]
