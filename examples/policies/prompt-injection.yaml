version: 3

engine:
  max_violations: 100
  on_analysis_error: block
  on_detector_timeout: block

scopes: [pending]

rules:
  - id: reject-prompt-injection
    action: block
    events:
      message:
        kind: message
        domain: visible
      call:
        kind: model_call
        domain: pending
    where:
      all:
        - relation:
            source: message
            target: call
            operator: linked_by
        - compare:
            left: {field: [message, payload, role]}
            operator: equals
            right: {literal: user}
        - detector:
            id: injection_scan
            capability: prompt_injection
            inputs:
              - value: {field: [message, payload, content, text]}
                encoding: text
    finding:
      code: prompt_injection_detected
      message: The message contains a high-signal prompt injection pattern.
      subjects: [call]
      evidence:
        - {source: detector, id: injection_scan}
